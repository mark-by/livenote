[package]
name = "livenote-vault-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
base64 = "0.22"
flate2 = "1"
livenote-diagrams = { path = "../diagrams" }
percent-encoding = "2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
vault-files = { path = "../vault-files" }
vault-read = { path = "../vault-read" }
zip = { version = "4", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
