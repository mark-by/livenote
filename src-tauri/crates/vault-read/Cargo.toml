[package]
name = "vault-read"
version = "0.1.0"
description = "Проекция документов и поисковый индекс LiveNote"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
icu_collator = "2.1"
jiff = { version = "0.2", default-features = false, features = ["serde", "std"] }
markdown = "1"
percent-encoding = "2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
yaml-rust2 = { version = "0.10", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
indexing_slicing = "deny"

