[package]
name = "livenote"
version = "0.1.0"
description = "Локальный визуальный блокнот LiveNote"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1"
browser-install = { path = "crates/browser-install" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
httpdate = "1"
livenote-diagrams = { path = "crates/diagrams" }
livenote-mcp = { path = "crates/mcp" }
livenote-vault-service = { path = "crates/vault-service" }
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rig-core = { version = "=0.31.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
