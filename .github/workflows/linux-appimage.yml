name: Linux AppImage

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Ожидаемый коммит ветки
        required: true
        type: string
      updater_pubkey:
        description: Открытый ключ Tauri в Base64
        required: true
        type: string

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Проверить коммит
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ "$GITHUB_SHA" != "$SOURCE_COMMIT" ]]; then
            echo "::error::Ветка изменилась перед запуском сборки"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libayatana-appindicator3-dev libfuse2t64 librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
          npm ci --no-audit --no-fund
      - name: Собрать AppImage без подписи
        env:
          UPDATER_PUBKEY: ${{ inputs.updater_pubkey }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const pubkey = process.env.UPDATER_PUBKEY;
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(pubkey)) throw new Error('Неверный открытый ключ');
          writeFileSync('release-overlay.json', JSON.stringify({
            bundle: { createUpdaterArtifacts: false },
            plugins: { updater: { pubkey } },
          }));
          NODE
          ./node_modules/.bin/tauri build --ci --target x86_64-unknown-linux-gnu \
            --bundles appimage --config release-overlay.json -- --locked
          version=$(node -p 'require("./package.json").version')
          mkdir -p release-output
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/bundle/appimage/LiveNote_${version}_amd64.AppImage" release-output/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: livenote-linux-x86_64
          path: release-output/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
